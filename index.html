<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<header class="header">
    <div class="container">
        <div class="container__inner header__inner">
            <div class="header__logo">
                <img class="header__logo-img" src="img/logo-1.svg.png" alt="">
                <p class="header__logo-text">Search destinations or activities</p>
            </div>
            <nav class="header__nav">
                <ul class="header__menu">
                    <li class="header__menu-item">
                        <a class="header__menu-link link-orange" href="#">Home</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="#destination">Destinations</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="#">Activities</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="#">USD</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="#">Sign up</a>
                    </li>
                </ul>
            </nav>
            <button class="header__btn">Sign in</button>
            <img class="hamburger" src="./img/17676927.png" alt="">
        </div>
    </div>
</header>
 <section class="home">
     <div class="container">
         <div class="home-banner">
             <div class="home-banner__inner">
                 <h1 class="home-banner__title">Your world of joy</h1>
                 <p class="home-banner__text">From local escapes to far-flung adventures, find what makes you happy anytime, anywhere</p>
             </div>
             <div class="home-banner__icons">
                 <div class="home-banner__feature">
                     <span class="home-banner__icon"></span>
                     <p class="home-banner__label">When</p>
                 </div>
                 <div class="home-banner__feature">
                     <span class="home-banner__icon"></span>
                     <p class="home-banner__label">Where</p>
                 </div>
                 <div class="home-banner__feature">
                     <span class="home-banner__icon"></span>
                     <p class="home-banner__label">Tour Type</p>
                 </div>
                 <button class="home-banner__btn">Sign up</button>
             </div>
         </div>
     </div>
 </section>
<script src="js/index.js"></script>
</body>
</html>
